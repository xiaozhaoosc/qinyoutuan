<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="qz-core" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
    <linearGradient id="qz-halo" x1="20" y1="14" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="qz-glow" cx=".5" cy=".42" r=".68">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深色圆角底 -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="#0b1526"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#q2-glow)" opacity="0"/>

  <!-- 内发光核晕 -->
  <circle cx="32" cy="32" r="17" fill="url(#q3-glow)" opacity="0"/>

  <!-- 连接线（力导向拓扑：中心 4 个外节点互联） -->
  <path d="M32 32 L15 20 M32 32 L49 20 M32 32 L13 40 M32 32 L51 40 M32 32 L23 52 M32 32 L41 52" stroke="url(#qz-halo)" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <path d="M15 20 L49 20 M13 40 L51 40" stroke="rgba(148,163,184,.28)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 中心核心节点 -->
  <circle cx="32" cy="32" r="10" fill="url(#qz-core)"/>
  <circle cx="32" cy="32" r="10" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
  <path d="M27 32 a5 5 0 0 1 5-5 M27 32 a5 5 0 0 0 5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".9"/>

  <!-- 环绕节点（团/互联） -->
  <circle cx="15" cy="20" r="3.4" fill="#22d3ee"/>
  <circle cx="49" cy="20" r="3.4" fill="#60a5fa"/>
  <circle cx="13" cy="40" r="2.6" fill="#818cf8"/>
  <circle cx="51" cy="40" r="2.6" fill="#38bdf8"/>
  <circle cx="23" cy="52" r="2.6" fill="#6c7cff"/>
  <circle cx="41" cy="52" r="2.6" fill="#22d3ee"/>
</svg>